name: Backend foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: apps/backend/.python-version
      - run: python -m pip install uv==0.11.19
      - run: python tools/backend-local-config.py
      - run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d --wait postgres
      - name: Backend lint, types, generated API and real-PostgreSQL tests
        env:
          AION_TEST_DATABASE_URL_FILE: ${{ github.workspace }}/.local/backend/database-url-host
        run: sh tools/check-backend.sh
      - name: Render generated database diagram locally
        env:
          AION_TEST_DATABASE_URL_FILE: ${{ github.workspace }}/.local/backend/database-url-host
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
          cd apps/backend
          uv run --locked python ../../tools/export-database-diagram.py --check --render-to ../../.local/schema/database-schema.svg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-schema
          path: .local/schema/database-schema.svg
          include-hidden-files: true
          retention-days: 14
      - name: Runtime dependency advisory check
        working-directory: apps/backend
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/aion-runtime.txt" > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/aion-runtime.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build and start container artifacts
        run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d --build --wait
      - name: Outage, persistence and proxy smoke
        run: python tools/smoke-backend.py
      - name: Build opt-in HTTPS account preview and local test inbox
        run: |
          python tools/auth-local-config.py
          VITE_AION_AUTH=1 VITE_AION_AUTH_LOCAL=1 VITE_AION_REMINDERS=1 pnpm build
          docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml -f deploy/compose.auth.local.yaml -f deploy/compose.reminders.local.yaml up -d --build --wait
      - run: uv run --project apps/backend --locked python tools/preview-verification-email.py
      - run: uv run --project apps/backend --locked python tools/preview-reminder-email.py
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify EN/ES accounts and profile sync through local SMTP capture
        env:
          AION_AUTH_TESTS: "1"
          AION_EMAIL_TESTS: "1"
          AION_REMINDER_TESTS: "1"
          AION_REMINDER_SMOKE_PROJECT: aion-foundation
          AION_BASE_URL: https://127.0.0.1:18443
        run: pnpm exec playwright test tests/e2e/auth.spec.ts tests/e2e/profile.spec.ts tests/e2e/account-pages.spec.ts tests/e2e/account-management.spec.ts tests/e2e/email-template.spec.ts tests/e2e/reminders.spec.ts --project=chromium
      - name: Verify the default account build defers reminder enrollment
        env:
          AION_AUTH_TESTS: "1"
          AION_DEFERRED_REMINDER_UI: "1"
          AION_BASE_URL: https://127.0.0.1:18443
        run: |
          VITE_AION_AUTH=1 VITE_AION_AUTH_LOCAL=1 VITE_AION_REMINDERS=0 pnpm build
          docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml -f deploy/compose.auth.local.yaml -f deploy/compose.reminders.local.yaml up -d --build --no-deps web
          pnpm exec playwright test tests/e2e/account-management.spec.ts --grep "deferred reminders" --project=chromium
      - name: Stop only the disposable foundation stack
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml down --remove-orphans
