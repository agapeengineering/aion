[project]
name = "aion-backend"
version = "0.1.0"
description = "Aion's optional account service — backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aion"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires an explicit disposable PostgreSQL connection"]
