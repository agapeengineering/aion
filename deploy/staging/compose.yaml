name: aion-staging

x-logging: &logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}

x-backend: &backend
  image: ${AION_BACKEND_IMAGE:?Load the reviewed ARM64 backend image}
  platform: linux/arm64
  pull_policy: never
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 128
  logging: *logging

x-auth: &auth
  AION_AUTH_ENABLED: "true"
  AION_AUTH_ORIGIN: https://127.0.0.1:28443
  AION_AUTH_SECRETS_FILE: /run/secrets/auth_keys
  AION_DATABASE_URL_FILE: /run/secrets/runtime_url
  AION_LOCAL_MAIL_CAPTURE: "true"
  AION_REMINDERS_ENABLED: "false"
  AION_RESEND_ENABLED: "false"

services:
  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    platform: linux/arm64
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, migrator_password, runtime_password]
    volumes:
      - database:/var/lib/postgresql
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/10-aion.sh:ro
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic]
    networks: [database]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U aion_migrator -d aion"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  migrate:
    <<: *backend
    command: [python, /release/migrate.py]
    environment:
      AION_DATABASE_URL_FILE: /run/secrets/migrator_url
    secrets: [migrator_url]
    volumes:
      - ./migrate.py:/release/migrate.py:ro
      - ./runtime-grants.sql:/release/runtime-grants.sql:ro
    networks: [database]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend
    command:
      - uvicorn
      - aion.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips=172.30.241.2
    environment: *auth
    secrets: [runtime_url, auth_keys]
    networks: [database, frontend]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, aion.check, api]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  worker:
    <<: *backend
    command: [python, -m, aion.worker]
    environment: *auth
    secrets: [runtime_url, auth_keys]
    networks: [database, mail]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, aion.check, worker]
      interval: 15s
      timeout: 3s
      retries: 3

  web:
    image: ${AION_WEB_IMAGE:?Load the reviewed ARM64 web image}
    platform: linux/arm64
    pull_policy: never
    networks:
      frontend:
        ipv4_address: 172.30.241.2
      loopback: {}
    ports: ["127.0.0.1:28443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_cert, tls_key]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, -O, /dev/null, https://127.0.0.1:8443/version.json]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    platform: linux/arm64
    user: "10001:10001"
    environment:
      MP_DATABASE: /tmp/capture.db
      MP_MAX_MESSAGES: "40"
      MP_MAX_AGE: 1h
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: '@example\.test$$'
      MP_IGNORE_DUPLICATE_IDS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_QUIET: "true"
    networks: [mail, loopback]
    ports: ["127.0.0.1:28025:8025"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *logging

networks:
  database: {internal: true}
  frontend:
    internal: true
    ipam:
      config: [{subnet: 172.30.241.0/29}]
  mail: {internal: true}
  loopback: {}

volumes:
  database: {}

secrets:
  postgres_password:
    file: ${AION_STAGING_STATE_DIR:?Set the persistent staging state directory}/postgres-password
  migrator_password:
    file: ${AION_STAGING_STATE_DIR}/migrator-password
  runtime_password:
    file: ${AION_STAGING_STATE_DIR}/runtime-password
  migrator_url:
    file: ${AION_STAGING_STATE_DIR}/migrator-url
  runtime_url:
    file: ${AION_STAGING_STATE_DIR}/runtime-url
  auth_keys:
    file: ${AION_STAGING_STATE_DIR}/auth-keys.json
  tls_cert:
    file: ${AION_STAGING_STATE_DIR}/tls.crt
  tls_key:
    file: ${AION_STAGING_STATE_DIR}/tls.key
