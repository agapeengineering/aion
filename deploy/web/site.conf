root /usr/share/nginx/html;
index index.html;
access_log off;
server_tokens off;
client_max_body_size 16k;

add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;

location ^~ /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://api:8000;
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    # This listener terminates TLS for private staging. Establish a new forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    error_page 413 = @api_request_too_large;
    error_page 502 504 = @api_unavailable;
}
location @api_request_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"request_too_large"}}';
}
location @api_unavailable {
    default_type application/json;
    return 503 '{"error":{"code":"unavailable"}}';
}
location = /api {
    default_type application/json;
    return 404 '{"error":{"code":"not_found"}}';
}
location ~ ^/(_headers|_redirects|\.assetsignore)$ { return 404; }
location = /es { try_files /es/index.html =404; }
location /es/ { try_files $uri $uri/ /es/index.html; }
location / { try_files $uri $uri/ /index.html; }
